[project]
name = "technical-training-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django ~= 6.1",
    "djangorestframework ~= 3.18",
    "django-cors-headers ~= 4.9",
    "djangorestframework-simplejwt ~= 5.5",
    "psycopg[binary] ~= 3.3",
    "django-environ ~= 0.14",
    "ruff ~= 0.16",
    "watchfiles ~= 1.2",
    # "watchdog[watchmedo] ~= 6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
